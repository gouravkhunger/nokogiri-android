# Tag → build 4 ABI gems → GitHub Release.
#
#   git tag -a v1.19.4 -m "1.19.4"
#   git push origin v1.19.4
name: Release

on:
  push:
    tags: ["v*", "[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild/re-release (required for dispatch)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  package-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - run: ruby -Itest test/test_package_structure.rb

  build:
    needs: package-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          local-cache: false
      - run: echo "NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - run: gem install mini_portile2 --no-document
      - run: ./scripts/build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: gem-${{ matrix.arch }}
          path: pkg/*.gem
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          path: gems
          merge-multiple: true
      - name: List gems
        run: |
          ls -la gems/
          test "$(find gems -name '*.gem' | wc -l)" -eq 4
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "No tag; refusing release" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: gems/*.gem
          fail_on_unmatched_files: true
          body: |
            Prebuilt Nokogiri for JekyllEx (Ruby 3.3). Install the downloaded gem. It replaces the bundled copy.

            ```bash
            gem install --local nokogiri-VERSION-aarch64-linux-android.gem --no-document
            ruby -e 'require "nokogiri"; p Nokogiri::VERSION'
            ```

            Platforms: `aarch64-linux-android`, `arm-linux-androideabi`, `i686-linux-android`, `x86_64-linux-android`.
