name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - name: Package structure test
        run: ruby -Itest test/test_package_structure.rb

  build:
    needs: package-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          local-cache: false
      - run: echo "NDK=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
      - run: gem install mini_portile2 --no-document
      - run: ./scripts/build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: nokogiri-${{ matrix.arch }}
          path: |
            pkg/*.gem
            out/**/nokogiri.so
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}
          path: nokogiri/ext/nokogiri/mkmf.log
          if-no-files-found: ignore
