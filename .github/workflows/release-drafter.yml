# Versioned multi-ABI build. Uploads .gem artifacts only.
# Does NOT create a GitHub Release and does NOT gem-push.
# Maintainer promotes artifacts to a Release after explicit approval.
name: Versioned Android gems

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional build note"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: false
      - name: Export NDK
        run: echo "NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Verify NDK clang
        run: |
          echo "NDK=$NDK"
          ls -la "$NDK/toolchains/llvm/prebuilt/" || true
          host=$(ls "$NDK/toolchains/llvm/prebuilt" | head -1)
          test -x "$NDK/toolchains/llvm/prebuilt/$host/bin/clang"
          "$NDK/toolchains/llvm/prebuilt/$host/bin/clang" --version | head -1
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y dpkg file
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.1"
      - run: gem install mini_portile2 --no-document
      - name: Standalone Nokogiri NDK build + package
        run: ./scripts/build_android.sh ${{ matrix.target_arch }}
      - name: Verify gem
        run: |
          gemfile=$(ls pkg/nokogiri-*.gem | head -1)
          ruby scripts/verify_gem.rb "$gemfile"
      - uses: actions/upload-artifact@v4
        with:
          name: nokogiri-${{ matrix.target_arch }}
          path: |
            pkg/*.gem
            out/**/nokogiri.so
